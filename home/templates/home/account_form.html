{% extends "home/ideas_base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="idea-detail">
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="idea-button">
            {{ button_label }}
        </button>
    </form>

    <p>
        <a href="{% url 'register' %}">Criar conta</a>
        ·
        <a href="{% url 'resend_confirmation' %}">
            Reenviar confirmação
        </a>
    </p>
</section>
{% endblock %}
