services:
  web:
    build: .
    ports:
      - "127.0.0.1:${DJANGO_PORT}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
    volumes:
      - .:/app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
